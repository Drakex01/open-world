<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERSPACE on GitHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-top: 0;
        }
        p {
            color: #8b949e;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .back-link {
            display: block;
            margin-top: 30px;
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💻</div>
        <h1>Open Source on GitHub</h1>
        <p>CYBERSPACE is built with transparency in mind. The core dashboard and its widgets are open source under the AGPL-3.0 license. We welcome contributions, issue reports, and feature requests from the community.</p>
        <a href="https://github.com/Drakex01/cyberspace" class="btn" target="_blank" rel="noopener">View Repository</a>
        <a href="/" class="back-link">&larr; Back to Dashboard</a>
    </div>
</body>
</html>
